<!doctype html>
<html data-theme="dark">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>{{ form_title }} — LFA Admin</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dca.css') }}"
    >
</head>

<body>

{% include "_navigation.html" %}

<main>

<header>
    <div class="label">
        LITEFEET AWARDS · ADMIN
    </div>

    <h1>{{ form_title }}</h1>

    {% include "_admin_lfa_nav.html" %}
</header>


{% with messages = get_flashed_messages() %}
    {% for message in messages %}
        <div class="flash">
            {{ message }}
        </div>
    {% endfor %}
{% endwith %}


<section>

<form
    method="post"
    class="lfa-contribution-form"
>

    <label>
        TYPE

        <select name="record_type" required>
            <option value="">
                Choose record type
            </option>

            {% set current_type =
                record.record_type if record else ""
            %}

            {% set types = [
                ("nomination", "Nomination"),
                ("award_winner", "Award Winner"),
                ("hall_of_fame", "Hall of Fame"),
                ("litefeet_achievement", "LiteFeet Achievement"),
                ("litefeet_humanitarian", "LiteFeet Humanitarian")
            ] %}

            {% for value, label in types %}
            <option
                value="{{ value }}"
                {% if current_type == value %}
                selected
                {% endif %}
            >
                {{ label }}
            </option>
            {% endfor %}
        </select>
    </label>


    <label>
        YEAR

        <select name="year" required>
            <option value="">Choose year</option>

            {% set current_year =
                record.year if record else none
            %}

            {% for year in [2026, 2025, 2024, 2023] %}
            <option
                value="{{ year }}"
                {% if current_year == year %}
                selected
                {% endif %}
            >
                {{ year }}
            </option>
            {% endfor %}
        </select>
    </label>


    <label>
        CATEGORY / HONOR

        <input
            type="text"
            name="category_name"
            value="{{ record.category_name if record else '' }}"
            required
        >
    </label>


    <label>
        PERSON / WINNER / HONOREE

        <input
            type="text"
            name="person_name"
            value="{{ record.person_name if record else '' }}"
            required
        >
    </label>


    <label>
        TEAM

        <input
            type="text"
            name="team_name"
            value="{{ record.team_name or '' if record else '' }}"
        >
    </label>


    <label>
        ADDITIONAL DETAILS

        <textarea
            name="additional_details"
        >{{ record.additional_details or '' if record else '' }}</textarea>
    </label>


    <label>
        SOURCE / EVIDENCE

        <textarea
            name="source_information"
        >{{ record.source_information or '' if record else '' }}</textarea>
    </label>


    <button type="submit">
        {{ submit_label }}
    </button>

</form>

</section>

</main>

</body>
</html>
