<script>
(function () {
    // Preserve visitors' existing light/dark preference.
    const key = "litefeet-ledger-theme";
    const saved = localStorage.getItem(key);
    document.documentElement.dataset.theme = (saved === "light" || saved === "dark") ? saved : "light";
})();
</script>
