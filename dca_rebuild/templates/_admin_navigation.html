<script>
(function(){
 var key='litefeet-ledger-theme';
 function apply(theme){
  document.documentElement.dataset.theme=theme;
  document.documentElement.classList.toggle('dark',theme==='dark');
  document.querySelectorAll('.lfv-admin-theme-toggle').forEach(function(button){
   button.setAttribute('aria-label','Switch to '+(theme==='dark'?'light':'dark')+' mode');
   button.setAttribute('aria-pressed',String(theme==='dark'));
   var label=button.querySelector('.lfv-admin-theme-text');
   if(label) label.textContent=theme==='dark'?'LIGHT MODE':'DARK MODE';
  });
 }
 var saved='light';try{saved=localStorage.getItem(key)||'light';}catch(_){}
 apply(saved==='dark'?'dark':'light');
 document.querySelectorAll('.lfv-admin-theme-toggle').forEach(function(button){
  button.addEventListener('click',function(){
   var next=document.documentElement.dataset.theme==='dark'?'light':'dark';
   apply(next);try{localStorage.setItem(key,next);}catch(_){}
  });
 });
})();
</script>
