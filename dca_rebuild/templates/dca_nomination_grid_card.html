<article class="lfv-dca-grid-card" data-category-id="{{ category.id }}">
  <button type="button" class="lfv-dca-grid-open" data-dca-open-category="{{ category.id }}" aria-haspopup="dialog" aria-label="Open {{ category.name }} nominations">
    <span class="lfv-dca-grid-title">{{ category.name }}</span>
    <span class="lfv-dca-grid-status">
      {% if closed %}Nominations closed
      {% elif category.remaining %}Available in <span data-cooldown-until="{{ category.next_at }}">{{ (category.remaining // 3600) }}h {{ ((category.remaining % 3600) // 60) }}m</span>
      {% else %}Available to nominate{% endif %}
    </span>
    <span class="lfv-dca-grid-cta">View nominees &amp; nominate →</span>
  </button>
  {% if category.nominees %}
  <ol class="lfv-dca-grid-preview" aria-label="Current nominees">
    {% for nominee in category.nominees[:3] %}
    <li><span>{% set profile_url = vault_profile_url(nominee.name) %}{% if profile_url %}<a href="{{ profile_url }}">{{ nominee.name }}</a>{% else %}{{ nominee.name }}{% endif %}</span><span>{{ nominee.count }}</span></li>
    {% endfor %}
  </ol>
  {% else %}
  <p class="lfv-dca-grid-empty">No nominations yet.</p>
  {% endif %}
</article>
