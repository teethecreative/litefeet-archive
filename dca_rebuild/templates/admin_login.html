<!doctype html>
<html>
<head>
<script>
(function () {
    const key = "litefeet-ledger-theme";
    const saved = localStorage.getItem(key);

    if (saved === "light" || saved === "dark") {
        document.documentElement.dataset.theme = saved;
    } else {
        document.documentElement.dataset.theme = "light";
    }
})();
</script>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>Admin Login — The LiteFeet Vault</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dca.css') }}"
    >
    <!-- LITEFEET_SHELLTOE_FAVICON_2026 -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png', v='20261102') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png', v='20261102') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico', v='20261102') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png', v='20261102') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/litefeet-sitewide.css') }}"> <!-- LFV_SITEWIDE_V1 -->
  <!-- LFV_EDITORIAL_V2_20261102 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/lfv-editorial-v2.css') }}">
  <style>
    .ledger-admin-login .label{color:var(--gold-light,#e7cb68);font-weight:800;letter-spacing:.09em}
    .ledger-admin-login .description{color:var(--text,#fff);opacity:1;line-height:1.6}
    .ledger-admin-login :is(input,button){max-width:100%;border-radius:5px}
    .ledger-admin-login button.submit{background:var(--gold,#c9a227);color:#091b36;font-weight:800}
  </style>
</head>

<body>

{% include "_navigation.html" %}

<main>
    <section class="ledger-admin-login">

        <div class="label">
            THE LITEFEET VAULT
        </div>

        <h1>
            ADMIN LOGIN
        </h1>

        <p class="description">
            Sign in to access The LiteFeet Vault administration.
        </p>

        {% if error %}
        <div class="flash">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" class="lf-admin-login-form">

            <label>
                <span>USERNAME</span>

                <input
                    type="text"
                    name="username"
                    autocomplete="username"
                    required
                >
            </label>

            <label>
                <span>PASSWORD</span>

                <input
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </label>

            <button
                class="submit"
                type="submit"
            >
                SIGN IN →
            </button>

        </form>

    </section>
</main>
{% include "_footer.html" %}

  <script defer src="{{ url_for('static', filename='js/litefeet-sitewide.js') }}"></script> <!-- LFV_SITEWIDE_V1 -->
</body>
</html>
