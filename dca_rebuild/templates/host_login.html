<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Host Sign In | The LiteFeet Vault</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/dca.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/litefeet-sitewide.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/host-workspace.css') }}"></head>
<body>{% include "_navigation.html" %}
<main class="lfv-host-wrap lfv-host-auth"><p class="lfv-host-eyebrow">EVENT HOST ACCESS</p><h1>Sign in</h1>
<p>For approved HypeItUpTV and Body Bag event hosts.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" class="lfv-host-auth-form">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Email address<input type="email" name="email" maxlength="254" autocomplete="email" required></label>
<label>Password<input type="password" name="password" autocomplete="current-password" required></label>
<input type="hidden" name="timezone" value="UTC" data-host-timezone><button type="submit">Sign in</button>
</form></main><script>document.querySelectorAll('[data-host-timezone]').forEach(function(el){try{el.value=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}catch(e){}})</script>
<script defer src="{{ url_for('static',filename='js/litefeet-sitewide.js') }}"></script></body></html>
