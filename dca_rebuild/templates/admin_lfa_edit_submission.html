<!doctype html>
<html>
<head>
<script>
(function () {
    const key = "litefeet-ledger-theme";
    const saved = localStorage.getItem(key);

    if (saved === "light" || saved === "dark") {
        document.documentElement.dataset.theme = saved;
    } else {
        document.documentElement.dataset.theme = "light";
    }
})();
</script>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>Edit LFA Submission — Admin</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dca.css') }}"
    >
    <!-- LITEFEET_SHELLTOE_FAVICON_2026 -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png', v='20261102') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png', v='20261102') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico', v='20261102') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png', v='20261102') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/litefeet-sitewide.css') }}"> <!-- LFV_SITEWIDE_V1 -->
  <!-- LFV_EDITORIAL_V2_20261102 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/lfv-editorial-v2.css') }}">
</head>

<body>

{% include "_admin_navigation.html" %}

<main>

<header>
    <div class="label">
        LITEFEET AWARDS · ADMIN
    </div>

    <h1>
        EDIT &<br>
        APPROVE
    </h1>

    {% include "_admin_lfa_nav.html" %}
</header>


<form
    method="post"
    class="lfa-contribution-form"
>

    <label>
        TYPE

        <select name="record_type" required>
            {% set types = [
                ("nomination", "Nomination"),
                ("award_winner", "Award Winner"),
                ("hall_of_fame", "Hall of Fame"),
                ("litefeet_achievement", "LiteFeet Achievement"),
                ("litefeet_humanitarian", "LiteFeet Humanitarian")
            ] %}

            {% for value, label in types %}
            <option
                value="{{ value }}"
                {% if submission.submission_type == value %}
                selected
                {% endif %}
            >
                {{ label }}
            </option>
            {% endfor %}
        </select>
    </label>


    <label>
        YEAR

        <input
            type="number"
            name="year"
            value="{{ submission.year }}"
            required
        >
    </label>


    <label>
        CATEGORY / HONOR

        <input
            type="text"
            name="category_name"
            value="{{ submission.category_name }}"
            required
        >
    </label>


    <label>
        PERSON / WINNER / HONOREE

        <input
            type="text"
            name="person_name"
            value="{{ submission.winner_name }}"
            required
        >
    </label>


    <label>
        TEAM

        <input
            type="text"
            name="team_name"
            value="{{ submission.team_name or '' }}"
        >
    </label>


    <label>
        ADDITIONAL DETAILS

        <textarea
            name="additional_details"
        >{{ submission.additional_details or '' }}</textarea>
    </label>


    <label>
        SOURCE / EVIDENCE

        <textarea
            name="source_information"
        >{{ submission.source_information or '' }}</textarea>
    </label>


    <button type="submit">
        SAVE & APPROVE →
    </button>

</form>

</main>

  <script defer src="{{ url_for('static', filename='js/litefeet-sitewide.js') }}"></script> <!-- LFV_SITEWIDE_V1 -->
</body>
</html>
