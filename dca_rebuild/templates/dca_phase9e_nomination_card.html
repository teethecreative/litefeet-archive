{% include "dca_nomination_status.html" %}
{% include "dca_nomination_history.html" %}
<div class="lf9e-nomination-form">
  <div>
    <h2>Nominate someone</h2>
    <form method="post" action="{{ url_for('dca_nominations_closed') }}" class="lf9e-entry-form" data-lf9e-entry>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="category_id" value="{{ category.id }}">
      <label>Nominee name <span aria-hidden="true">*</span><input name="name" maxlength="250" minlength="2" required placeholder="Dancer, team, or nominee" autocomplete="off" value="{{ suggestion.name if suggestion else '' }}"></label>
      <label>Team <span class="lf9e-optional">(optional)</span><input name="team" maxlength="250" placeholder="Team or crew"></label>
      <label>Location <span class="lf9e-optional">(optional)</span><input name="location" maxlength="250" placeholder="City / state"></label>
      <label>Instagram <span class="lf9e-optional">(optional)</span><input name="instagram" maxlength="100" placeholder="@username"></label>
      <label>Why are you nominating them? <span class="lf9e-optional">(optional)</span><textarea name="reason" maxlength="2000" rows="3" placeholder="What makes them stand out?"></textarea></label>
      <button type="button" class="lf9e-add" data-add-later>+ SAVE ANOTHER IDEA FOR LATER</button>
      <p class="lf9e-note">The + saves a future nomination idea in this browser only. It is not submitted, and the category cooldown still applies.</p>
      <button type="submit" class="lf9e-primary" {% if not category.available %}disabled{% endif %}>{% if closed %}NOMINATIONS CLOSED{% elif category.remaining %}CATEGORY ON COOLDOWN{% else %}SUBMIT NOMINATION{% endif %}</button>
    </form>
    <form method="post" class="lf9e-buttons"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="category_id" value="{{ category.id }}"><button name="action" value="skip" class="lf9e-secondary" {% if closed %}disabled{% endif %}>SKIP / RETURN TO CATEGORIES</button></form>
  </div>
</div>
