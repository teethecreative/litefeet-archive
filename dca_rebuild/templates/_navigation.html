<nav class="awards-global-nav">
    <a
        class="awards-brand"
        href="{{ url_for('index') }}"
    >
        LITEFEET LEDGER
    </a>

    <button
        class="mobile-nav-toggle"
        type="button"
        aria-label="Open navigation"
        aria-expanded="false"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="awards-nav-groups">

        <div class="nav-dropdown">
            <button
                class="nav-dropdown-button"
                type="button"
                aria-expanded="false"
            >
                DANCER'S CHOICE AWARDS
                <span>▾</span>
            </button>

            <div class="nav-dropdown-menu">
                <a href="{{ url_for('dca_2026_home') }}">
                    2026
                </a>

                <a href="{{ url_for('dca_2023_home') }}">
                    2023
                </a>
            </div>
        </div>

        <a
            class="nav-direct-link"
            href="{{ url_for('lfa_home') }}"
        >
            LITEFEET AWARDS
        </a>

        <a
            class="nav-direct-link"
            href="{{ url_for('hypeitup_awards') }}"
        >
            HYPEITUPTV AWARDS
        </a>

        <a
            class="nav-direct-link"
            href="{{ url_for('admin_login') }}"
        >
            ADMIN
        </a>

        <div class="global-theme-control">
            <span>LIGHT</span>

            <button
                class="global-theme-toggle"
                type="button"
                aria-label="Switch between light and dark mode"
            >
                <span class="theme-toggle-track">
                    <span class="theme-toggle-dot"></span>
                </span>
            </button>

            <span>DARK</span>
        </div>

    </div>
</nav>

<script>
(function () {
    const root = document.documentElement;
    const nav = document.querySelector(".awards-global-nav");
    const menuToggle = document.querySelector(".mobile-nav-toggle");
    const storageKey = "litefeet-awards-theme";

    function applyTheme(theme) {
        root.dataset.theme = theme;
        localStorage.setItem(storageKey, theme);
    }

    applyTheme(
        localStorage.getItem(storageKey) || "light"
    );

    document
        .querySelectorAll(".global-theme-toggle")
        .forEach(function (button) {
            button.addEventListener("click", function () {
                const current =
                    root.dataset.theme || "light";

                applyTheme(
                    current === "dark"
                        ? "light"
                        : "dark"
                );
            });
        });

    if (menuToggle && nav) {
        menuToggle.addEventListener(
            "click",
            function (event) {
                event.stopPropagation();

                const open =
                    nav.classList.toggle(
                        "mobile-nav-open"
                    );

                menuToggle.setAttribute(
                    "aria-expanded",
                    open ? "true" : "false"
                );
            }
        );
    }

    document
        .querySelectorAll(".nav-dropdown-button")
        .forEach(function (button) {
            button.addEventListener(
                "click",
                function (event) {
                    event.stopPropagation();

                    const parent =
                        button.closest(".nav-dropdown");

                    document
                        .querySelectorAll(
                            ".nav-dropdown.open"
                        )
                        .forEach(function (dropdown) {
                            if (dropdown !== parent) {
                                dropdown.classList.remove(
                                    "open"
                                );

                                const otherButton =
                                    dropdown.querySelector(
                                        ".nav-dropdown-button"
                                    );

                                if (otherButton) {
                                    otherButton.setAttribute(
                                        "aria-expanded",
                                        "false"
                                    );
                                }
                            }
                        });

                    const open =
                        parent.classList.toggle("open");

                    button.setAttribute(
                        "aria-expanded",
                        open ? "true" : "false"
                    );
                }
            );
        });

    document
        .querySelectorAll(".nav-dropdown-menu a")
        .forEach(function (link) {
            link.addEventListener(
                "click",
                function () {
                    if (nav) {
                        nav.classList.remove(
                            "mobile-nav-open"
                        );
                    }

                    if (menuToggle) {
                        menuToggle.setAttribute(
                            "aria-expanded",
                            "false"
                        );
                    }
                }
            );
        });

    document.addEventListener(
        "click",
        function (event) {
            if (
                nav &&
                nav.classList.contains("mobile-nav-open") &&
                !nav.contains(event.target)
            ) {
                nav.classList.remove(
                    "mobile-nav-open"
                );

                if (menuToggle) {
                    menuToggle.setAttribute(
                        "aria-expanded",
                        "false"
                    );
                }
            }

            document
                .querySelectorAll(".nav-dropdown.open")
                .forEach(function (dropdown) {
                    if (!dropdown.contains(event.target)) {
                        dropdown.classList.remove("open");

                        const button =
                            dropdown.querySelector(
                                ".nav-dropdown-button"
                            );

                        if (button) {
                            button.setAttribute(
                                "aria-expanded",
                                "false"
                            );
                        }
                    }
                });
        }
    );
})();
</script>
