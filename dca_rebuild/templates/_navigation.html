<nav class="awards-global-nav" aria-label="Main navigation">
  <a class="awards-brand" href="/">THE LITEFEET VAULT</a>
  <div class="lfv-fallback-navigation">
  {% for item in vault_navigation %}
    {% if item.children %}<details><summary>{{ item.label }}</summary><a href="{{ item.href }}">{{ item.label }} overview</a>{% for child in item.children %}<a href="{{ child.href }}">{{ child.label }}</a>{% endfor %}</details>
    {% else %}<a href="{{ item.href }}">{{ item.label }}</a>{% endif %}
  {% endfor %}
  </div>
</nav>
