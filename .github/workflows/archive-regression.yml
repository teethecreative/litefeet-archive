name: Vault archive regression

on:
  pull_request:
    paths:
      - 'app.py'
      - 'dca_rebuild/**'
      - 'templates/**'
      - 'static/**'
      - 'tools/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/archive-regression.yml'
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - 'dca_rebuild/**'
      - 'templates/**'
      - 'static/**'
      - 'tools/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/archive-regression.yml'
  workflow_dispatch:

jobs:
  archive-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Reject committed local databases
        run: |
          if git ls-files '*.db' '*.sqlite' '*.sqlite3' | grep -q .; then
            echo "Local database files must not be committed."
            exit 1
          fi
      - name: Check source syntax
        run: python -m compileall -q app.py dca_rebuild tools
      - name: Run archive and public regression tests
        env:
          TEST_BROWSER: '0'
          DCA_SECRET_KEY: github-actions-archive-testing-secret
          DATABASE_URL: sqlite:///vault-archive-checks.db
        run: |
          python -m pytest -q tests
          python -m tools.verify_archive_staging
